# =============================================================================
#  Stateless application tier: consumer, write-api, read-api, frontend.
#  These scale horizontally:
#    * consumer : replicas share Kafka partitions (one consumer group), so
#                 useful replicas <= partitions per topic (3).
#    * read-api : stateless; scale freely with read traffic (HPA below).
#  Images are built locally:  docker build -t cdc-consumer:latest ./consumer  etc.
# =============================================================================

# ------------------------------------------------------------- CDC consumer
apiVersion: apps/v1
kind: Deployment
metadata: { name: consumer, namespace: cdc }
spec:
  replicas: 2
  selector: { matchLabels: { app: consumer } }
  template:
    metadata:
      labels: { app: consumer }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      enableServiceLinks: false
      containers:
        - name: consumer
          image: cdc-consumer:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:29092" }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - { name: TOPIC_PREFIX, value: shopdb }
          ports: [{ containerPort: 8000, name: metrics }]
          livenessProbe:
            httpGet: { path: /metrics, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: consumer-metrics, namespace: cdc }
spec:
  selector: { app: consumer }
  ports: [{ port: 8000, name: metrics }]
---
# ---------------------------------------------------------------- write-api
apiVersion: apps/v1
kind: Deployment
metadata: { name: write-api, namespace: cdc }
spec:
  replicas: 1
  selector: { matchLabels: { app: write-api } }
  template:
    metadata: { labels: { app: write-api } }
    spec:
      enableServiceLinks: false
      containers:
        - name: write-api
          image: cdc-write-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: PG_HOST, value: postgres }
            - { name: PG_PORT, value: "5432" }
            - name: PG_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: APP_DB_USER } }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: APP_DB_PASSWORD } }
            - name: PG_DB
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
            - { name: REDIS_HOST, value: redis }
          ports: [{ containerPort: 5001 }]
          readinessProbe:
            httpGet: { path: /api/write/health, port: 5001 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: write-api, namespace: cdc }
spec:
  selector: { app: write-api }
  ports: [{ port: 5001 }]
---
# ----------------------------------------------------------------- read-api
apiVersion: apps/v1
kind: Deployment
metadata: { name: read-api, namespace: cdc }
spec:
  replicas: 2
  selector: { matchLabels: { app: read-api } }
  template:
    metadata: { labels: { app: read-api } }
    spec:
      enableServiceLinks: false
      containers:
        - name: read-api
          image: cdc-read-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
          ports: [{ containerPort: 5002 }]
          readinessProbe:
            httpGet: { path: /api/read/health, port: 5002 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: read-api, namespace: cdc }
spec:
  selector: { app: read-api }
  ports: [{ port: 5002 }]
---
# Auto-scaling of the read side (needs metrics-server: `minikube addons enable metrics-server`).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: read-api, namespace: cdc }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: read-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: consumer, namespace: cdc }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: consumer }
  minReplicas: 1
  maxReplicas: 3            # = Kafka partitions; more replicas would sit idle
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
# ----------------------------------------------------------------- frontend
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: cdc }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: site, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: site, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
      volumes:
        - name: site
          configMap: { name: frontend }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: cdc }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 80, nodePort: 30080 }]
