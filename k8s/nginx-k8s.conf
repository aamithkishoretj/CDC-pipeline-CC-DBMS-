# nginx config for Kubernetes. Service ClusterIPs are stable, so static
# upstreams are fine here (Docker Compose uses frontend/nginx.conf instead).
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location /api/write/ {
        proxy_pass http://write-api:5001;
        proxy_set_header Host $host;
    }

    location /api/read/ {
        proxy_pass http://read-api:5002;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
