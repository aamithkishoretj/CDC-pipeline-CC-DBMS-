# Namespace + credentials. Credentials live in a Secret, not in the pod specs.
apiVersion: v1
kind: Namespace
metadata:
  name: cdc
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: cdc
type: Opaque
stringData:
  POSTGRES_USER: cdcuser          # schema owner, used only by the Postgres container itself
  POSTGRES_PASSWORD: cdcpass
  POSTGRES_DB: shopdb
  APP_DB_USER: app_writer         # least-privilege role for write-api (see postgres-init/03_roles.sql)
  APP_DB_PASSWORD: writerpass
