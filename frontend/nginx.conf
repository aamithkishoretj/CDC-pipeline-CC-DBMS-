# Serves the website and routes API calls to the right side of the system:
#   /api/write/*  -> write-api (PostgreSQL)
#   /api/read/*   -> read-api  (Redis)
#
# Upstreams are resolved through Docker's DNS on every request (resolver +
# variables), so a restarted API container with a new IP is picked up instead
# of nginx returning 502 with a stale cached address.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $write_api http://write-api:5001;
    set $read_api  http://read-api:5002;

    location = /nginx.conf { return 404; }

    location /api/write/ {
        proxy_pass $write_api;
        proxy_set_header Host $host;
    }

    location /api/read/ {
        proxy_pass $read_api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
